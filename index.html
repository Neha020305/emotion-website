<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Emotion Recognition — CNN vs ResNet</title>
<style>
  * { box-sizing: border-box; }

  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: linear-gradient(135deg, #0f0f1a 0%, #1a1a2e 100%);
    color: #eee;
    margin: 0;
    padding: 30px 16px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  h2 {
    font-size: 1.8rem;
    font-weight: 600;
    margin-bottom: 4px;
    background: linear-gradient(90deg, #6ee7b7, #60a5fa);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .subtitle {
    color: #888;
    font-size: 0.9rem;
    margin-bottom: 24px;
  }

  .card {
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 16px;
    padding: 24px;
    max-width: 440px;
    width: 100%;
    box-shadow: 0 8px 32px rgba(0,0,0,0.35);
    backdrop-filter: blur(6px);
  }

  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    justify-content: center;
    margin-bottom: 18px;
  }

  select, button, input[type=file]::file-selector-button {
    background: #1f2937;
    color: #eee;
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 8px;
    padding: 8px 14px;
    font-size: 0.85rem;
    cursor: pointer;
    transition: background 0.2s, transform 0.1s;
  }

  select:hover, button:hover, input[type=file]::file-selector-button:hover {
    background: #2d3748;
  }

  button:active { transform: scale(0.96); }

  button#uploadBtn {
    background: linear-gradient(90deg, #059669, #10b981);
    border: none;
    font-weight: 600;
  }
  button#uploadBtn:hover { filter: brightness(1.1); }

  button#resumeBtn {
    background: linear-gradient(90deg, #2563eb, #3b82f6);
    border: none;
    font-weight: 600;
  }
  button#resumeBtn:hover { filter: brightness(1.1); }

  input[type=file] {
    color: #ccc;
    font-size: 0.8rem;
  }

  #mode {
    text-align: center;
    font-size: 0.75rem;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: #6ee7b7;
    margin-bottom: 12px;
    transition: color 0.3s;
  }
  #mode.photo { color: #60a5fa; }

  .media-wrap {
    position: relative;
    border-radius: 12px;
    overflow: hidden;
    border: 2px solid rgba(255,255,255,0.1);
    margin-bottom: 10px;
    animation: fadeIn 0.4s ease;
  }

  video, img#uploadPreview {
    display: block;
    width: 100%;
    height: 280px;
    object-fit: cover;
    transform: scaleX(-1);
  }
  img#uploadPreview { transform: none; }

  #status {
    text-align: center;
    color: #f87171;
    font-size: 0.85rem;
    min-height: 20px;
    margin-bottom: 10px;
  }

  .bars { margin-top: 10px; }

  .bar-row {
    display: flex;
    align-items: center;
    margin: 10px 0;
    gap: 10px;
    animation: slideIn 0.3s ease;
  }

  .bar-label {
    width: 64px;
    font-size: 0.85rem;
    text-transform: capitalize;
    color: #ccc;
  }

  .bar-track {
    flex: 1;
    background: rgba(255,255,255,0.07);
    height: 16px;
    border-radius: 8px;
    overflow: hidden;
  }

  .bar-fill {
    height: 100%;
    border-radius: 8px;
    width: 0%;
    transition: width 0.35s cubic-bezier(.4,0,.2,1);
    background: linear-gradient(90deg, #059669, #34d399);
  }

  .bar-fill.angry  { background: linear-gradient(90deg, #dc2626, #f87171); }
  .bar-fill.happy  { background: linear-gradient(90deg, #d97706, #fbbf24); }
  .bar-fill.neutral{ background: linear-gradient(90deg, #4b5563, #9ca3af); }
  .bar-fill.sad    { background: linear-gradient(90deg, #2563eb, #60a5fa); }

  .bar-pct {
    width: 42px;
    text-align: right;
    font-size: 0.85rem;
    font-variant-numeric: tabular-nums;
    color: #ddd;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: scale(0.98); }
    to { opacity: 1; transform: scale(1); }
  }
  @keyframes slideIn {
    from { opacity: 0; transform: translateX(-8px); }
    to { opacity: 1; transform: translateX(0); }
  }
</style>
</head>
<body>

<h2>Live Emotion Recognition</h2>
<div class="subtitle">Custom CNN vs ResNet18 — real-time facial emotion detection</div>

<div class="card">
  <div class="controls">
    <select id="modelSelect">
      <option value="cnn">Custom CNN</option>
      <option value="resnet">ResNet18</option>
    </select>
    <input type="file" id="imageUpload" accept="image/*">
    <button id="uploadBtn">Predict from Photo</button>
    <button id="resumeBtn">Resume Webcam</button>
  </div>

  <div id="mode">Live Webcam Mode</div>

  <div class="media-wrap">
    <video id="video" autoplay muted></video>
    <img id="uploadPreview" style="display:none;">
  </div>

  <div id="status"></div>

  <div class="bars" id="bars"></div>
</div>

<script>
const video = document.getElementById("video");
const uploadPreview = document.getElementById("uploadPreview");
const bars = document.getElementById("bars");
const status = document.getElementById("status");
const modeLabel = document.getElementById("mode");
const modelSelect = document.getElementById("modelSelect");
const CLASSES = ["angry", "happy", "neutral", "sad"];
const API = "/predict";

CLASSES.forEach(c => {
  bars.innerHTML += `
    <div class="bar-row">
      <div class="bar-label">${c}</div>
      <div class="bar-track"><div class="bar-fill ${c}" id="fill-${c}"></div></div>
      <div class="bar-pct" id="pct-${c}">0%</div>
    </div>`;
});

navigator.mediaDevices.getUserMedia({ video: true })
  .then(stream => { video.srcObject = stream; })
  .catch(err => { status.textContent = "Camera error: " + err.message; });

const canvas = document.createElement("canvas");
canvas.width = 224; canvas.height = 224;
const ctx = canvas.getContext("2d");

function renderProbs(probs) {
  CLASSES.forEach(c => {
    const pct = Math.round(probs[c] * 100);
    document.getElementById(`fill-${c}`).style.width = pct + "%";
    document.getElementById(`pct-${c}`).textContent = pct + "%";
  });
}

async function sendBlobToServer(blob) {
  const form = new FormData();
  form.append("file", blob, "frame.jpg");
  const res = await fetch(API, { method: "POST", body: form });
  if (!res.ok) throw new Error("server returned " + res.status);
  return res.json();
}

async function captureAndSend() {
  if (video.readyState < 2) return;
  ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
  canvas.toBlob(async (blob) => {
    try {
      const data = await sendBlobToServer(blob);
      status.textContent = "";
      renderProbs(data[modelSelect.value]);
    } catch (err) {
      status.textContent = "Prediction error: " + err.message;
    }
  }, "image/jpeg", 0.9);
}

let liveInterval = setInterval(captureAndSend, 500);

document.getElementById("uploadBtn").addEventListener("click", async () => {
  const fileInput = document.getElementById("imageUpload");
  if (!fileInput.files[0]) {
    status.textContent = "Choose a photo first";
    return;
  }
  clearInterval(liveInterval);
  video.style.display = "none";
  uploadPreview.src = URL.createObjectURL(fileInput.files[0]);
  uploadPreview.style.display = "block";
  modeLabel.textContent = "Photo Mode (webcam paused)";
  modeLabel.classList.add("photo");
  try {
    const data = await sendBlobToServer(fileInput.files[0]);
    status.textContent = "Prediction from: " + fileInput.files[0].name;
    renderProbs(data[modelSelect.value]);
  } catch (err) {
    status.textContent = "Prediction error: " + err.message;
  }
});

document.getElementById("resumeBtn").addEventListener("click", () => {
  clearInterval(liveInterval);
  liveInterval = setInterval(captureAndSend, 500);
  video.style.display = "block";
  uploadPreview.style.display = "none";
  modeLabel.textContent = "Live Webcam Mode";
  modeLabel.classList.remove("photo");
  status.textContent = "";
});
</script>
</body>
</html>
